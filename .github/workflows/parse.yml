name: Run Email Parser

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python email_parser.py
        env:
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
